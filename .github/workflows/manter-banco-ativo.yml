# Acorda o banco de sincronização (Supabase, plano grátis) a cada 3 dias,
# para ele não ser pausado por falta de uso.
name: Manter banco ativo
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        run: |
          curl -sS -o /dev/null -w "auth: %{http_code}\n" \
            "https://mekokzwnudakvkhtcmrx.supabase.co/auth/v1/health" \
            -H "apikey: sb_publishable_7Y_FDCHFOjKQeytVqZ03-A_No5Q_2Qx"
          curl -sS -o /dev/null -w "rest: %{http_code}\n" \
            "https://mekokzwnudakvkhtcmrx.supabase.co/rest/v1/rpc/keepalive" -X POST \
            -H "apikey: sb_publishable_7Y_FDCHFOjKQeytVqZ03-A_No5Q_2Qx" \
            -H "Content-Type: application/json" -d '{}'
