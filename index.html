<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcador</title>
<meta name="description" content="Registro de sessões de estudo e de leitura diária.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#19201C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marcador">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap">
<style>
/* Layout: caderno de estudo — topo fixo com navegação, coluna central de 1040px, cartões só onde há um objeto (timer, livro, modal); capas de livro geradas como objetos físicos. */
:root {
  --bg: #F3F5F0;
  --surface: #FFFFFF;
  --surface-2: #E9EDE6;
  --line: #D8DED3;
  --ink: #16201A;
  --muted: #5B6860;
  --accent: #1D6A53;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEAE2;
  --ribbon: #9C5C0E;
  --ribbon-soft: #F4E5C9;
  --danger: #B42318;
  --danger-soft: #FBE3DF;
  --good: #2E7D3B;
  --heat-0: #E4E8E0;
  --heat-1: #C2DFD0;
  --heat-2: #8BC4AA;
  --heat-3: #4D9C7E;
  --heat-4: #1D6A53;
  --heat-ink: #F2F7F4;
  --overlay: rgba(12, 18, 15, 0.5);
  --shadow: 0 1px 2px rgba(18, 28, 22, 0.05), 0 4px 14px rgba(18, 28, 22, 0.05);
  --f-display: "Literata", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #19201C; --surface-2: #222A25; --line: #2E3832; --ink: #E6ECE8; --muted: #98A69E;
    --accent: #62C3A2; --accent-ink: #0C1913; --accent-soft: #1E3A30; --ribbon: #E2A64C; --ribbon-soft: #3A2C15;
    --danger: #F2877A; --danger-soft: #3D1E1A; --good: #74C77F;
    --heat-0: #222A25; --heat-1: #1E4335; --heat-2: #2B6A52; --heat-3: #3F9575; --heat-4: #6ACBA6; --heat-ink: #0C1913;
    --overlay: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #19201C; --surface-2: #222A25; --line: #2E3832; --ink: #E6ECE8; --muted: #98A69E;
  --accent: #62C3A2; --accent-ink: #0C1913; --accent-soft: #1E3A30; --ribbon: #E2A64C; --ribbon-soft: #3A2C15;
  --danger: #F2877A; --danger-soft: #3D1E1A; --good: #74C77F;
  --heat-0: #222A25; --heat-1: #1E4335; --heat-2: #2B6A52; --heat-3: #3F9575; --heat-4: #6ACBA6; --heat-ink: #0C1913;
  --overlay: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; color-scheme: light; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.75rem; line-height: 1.15; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.84rem; }
.eyebrow { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* ---------- shell ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 1072px; margin: 0 auto; display: flex; align-items: center; gap: 16px; height: 58px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; text-decoration: none; color: var(--ink); }
.brand-mark { width: 14px; height: 22px; background: var(--ribbon); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%); }
.nav { display: flex; gap: 2px; margin-left: 8px; flex: 1; min-width: 0; }
.nav a {
  padding: 7px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 0.92rem; white-space: nowrap;
}
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.nav a.active { color: var(--accent); background: var(--accent-soft); }
.sync { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[data-s="synced"] .sync-dot { background: var(--good); }
.sync[data-s="connecting"] .sync-dot { background: var(--ribbon); }
.sync[data-s="error"] .sync-dot { background: var(--danger); }

.main {
  max-width: 1072px; margin: 0 auto; padding-block: 24px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bottomnav { display: none; }
@media (max-width: 860px) {
  .nav { display: none; }
  .sync-label { display: none; }
  .topbar-in { justify-content: space-between; }
  .bottomnav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(4px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px));
  }
  .bottomnav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 2px; text-decoration: none; color: var(--muted); font-size: 0.7rem; font-weight: 500; }
  .bottomnav a.active { color: var(--accent); }
  .bottomnav svg { width: 22px; height: 22px; }
}

/* ---------- page bits ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head .sub { color: var(--muted); margin-top: 4px; }
.section { margin-top: 28px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.grid { display: grid; gap: 14px; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 860px) { .home-grid { grid-template-columns: minmax(0, 1fr); } .cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .cols-3 { grid-template-columns: minmax(0, 1fr); } .cols-2.keep { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols-2:not(.keep) { grid-template-columns: minmax(0, 1fr); } }

/* stat strip: a ruled ledger rather than four floating cards */
.ledger { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ledger > div { padding: 14px 16px; border-left: 1px solid var(--line); min-width: 0; }
.ledger > div:first-child { border-left: none; }
.ledger .k { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
.ledger .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 1.45rem; font-weight: 500; margin-top: 2px; white-space: nowrap; }
.ledger .v small { font-size: 0.8rem; color: var(--muted); font-weight: 400; }
.ledger .meter { margin-top: 8px; }
@media (max-width: 560px) {
  .ledger { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ledger > div { border-left: none; border-top: 1px solid var(--line); }
  .ledger > div:nth-child(-n+2) { border-top: none; }
  .ledger > div:nth-child(even) { border-left: 1px solid var(--line); }
  .ledger[style*="--n: 3"] > div:last-child { grid-column: 1 / -1; border-left: none; }
}
.meter { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 6px; background: var(--accent); transition: width .3s ease; }
.meter.ribbon > i { background: var(--ribbon); }
.meter.done > i { background: var(--good); }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 10px;
  padding: 9px 16px; font-weight: 600; font-size: 0.92rem; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: filter .12s ease, background .12s ease;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-soft { background: var(--accent-soft); color: var(--accent); }
.btn-soft:hover { filter: brightness(0.97); }
.btn-ribbon { background: var(--ribbon-soft); color: var(--ribbon); }
.btn-line { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-line:hover { background: var(--surface-2); }
.btn-ghost { background: transparent; color: var(--muted); padding: 7px 10px; }
.btn-ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-sm { padding: 6px 11px; font-size: 0.84rem; border-radius: 8px; }
.btn-block { width: 100%; }
.link { background: none; border: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; font-size: 0.88rem; }

input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="date"], input[type="time"], input[type="search"], select, textarea {
  font-size: 16px;
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }
label.lbl { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.field { margin-bottom: 14px; min-width: 0; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > .field { flex: 1 1 120px; }
.hint { font-size: 0.8rem; color: var(--muted); margin-top: 5px; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: none; background: transparent; color: var(--muted); padding: 6px 13px; border-radius: 999px; font-size: 0.84rem; font-weight: 600; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }

.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 9px; border-radius: 999px; background: var(--surface-2); font-weight: 600; font-size: 0.88rem; }
.chip { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 0.74rem; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.chip.reading { background: var(--accent-soft); color: var(--accent); }
.chip.done { background: var(--ribbon-soft); color: var(--ribbon); }

.empty { text-align: center; color: var(--muted); padding: 26px 12px; }
.empty strong { display: block; color: var(--ink); font-family: var(--f-display); font-size: 1.05rem; margin-bottom: 4px; }
.empty .btn { margin-top: 12px; }

/* ---------- timer ---------- */
.timer { text-align: center; padding: 6px 0 4px; }
.clock { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: clamp(2.6rem, 9vw, 3.6rem); font-weight: 500; letter-spacing: -0.02em; margin: 14px 0 16px; line-height: 1; }
.clock.urgent { color: var(--danger); }
.timer-controls { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.presets { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
.presets .btn.on { background: var(--accent); color: var(--accent-ink); }
.center-select { max-width: 340px; margin: 0 auto; }

/* ---------- covers & books ---------- */
.cover {
  position: relative; width: 74px; aspect-ratio: 2 / 3; max-width: 100%; flex-shrink: 0; border-radius: 3px 6px 6px 3px; overflow: hidden;
  background: var(--c1); color: var(--c2); padding: 10% 9% 9% 14%; display: flex; flex-direction: column;
  box-shadow: inset 4px 0 0 rgba(0,0,0,.22), inset 5px 0 0 rgba(255,255,255,.12), 0 2px 6px rgba(0,0,0,.18);
}
.cover::after { content: ""; position: absolute; left: 14%; right: 9%; top: 6%; height: 1px; background: currentColor; opacity: .5; }
.cover-t { font-family: "Literata", Georgia, serif; font-weight: 600; font-size: 0.62rem; line-height: 1.15; margin-top: 8%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; word-break: break-word; }
.cover-a { margin-top: auto; font-family: "Figtree", system-ui, sans-serif; font-size: 0.48rem; letter-spacing: .06em; text-transform: uppercase; opacity: .85; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; background: var(--c1); }
.cover:has(img)::after { display: none; }
.cover.lg { width: 112px; }
ul.steps { margin: 12px 0 0; padding-left: 18px; display: grid; gap: 8px; font-size: 0.9rem; }
.cover.lg .cover-t { font-size: 0.86rem; }
.cover.lg .cover-a { font-size: 0.6rem; }
.cover.sm { width: 46px; padding: 8% 7% 8% 14%; }
.cover.sm .cover-t { font-size: 0.42rem; -webkit-line-clamp: 4; }
.cover.sm .cover-a { display: none; }

.book-card { display: flex; gap: 16px; align-items: flex-start; }
.book-card .body { flex: 1; min-width: 0; }
.book-title { font-family: var(--f-display); font-weight: 600; font-size: 1.08rem; line-height: 1.25; }
.book-author { color: var(--muted); font-size: 0.88rem; margin-top: 2px; }
.book-progress { margin-top: 12px; }
.book-progress .line { display: flex; justify-content: space-between; gap: 8px; font-size: 0.82rem; margin-bottom: 6px; }
.book-facts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 0.82rem; color: var(--muted); }
.book-facts b { color: var(--ink); font-weight: 600; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.book-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.reading-mini { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.reading-mini:last-of-type { border-bottom: none; }
.reading-mini .body { flex: 1; min-width: 0; }
.reading-mini .t { font-weight: 600; font-family: var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.queue { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 10px; }
.queue-item { width: 92px; flex-shrink: 0; background: none; border: none; padding: 0; text-align: left; cursor: pointer; }
.queue-item .cover { width: 92px; }
.queue-item .cap { font-size: 0.78rem; margin-top: 6px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.shelf { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 3px 3px; padding: 14px 4px 0; border-bottom: 10px solid var(--line); min-height: 60px; }
.spine {
  border: none; cursor: pointer; padding: 8px 0; border-radius: 2px 2px 0 0; background: var(--c1); color: var(--c2);
  writing-mode: vertical-rl; transform: rotate(180deg); font-family: "Literata", Georgia, serif; font-weight: 600; font-size: 0.72rem;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; box-shadow: inset -2px 0 0 rgba(0,0,0,.18); transition: transform .15s ease;
}
.spine:hover { transform: rotate(180deg) translateY(4px); }
.shelf-legend { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }

/* search */
.search-box { position: relative; }
.search-box input { padding-left: 38px; font-size: 1rem; }
.search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.results { margin-top: 10px; display: grid; gap: 2px; }
.result { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 10px; border: none; background: transparent; text-align: left; cursor: pointer; width: 100%; }
.result:hover, .result:focus-visible { background: var(--surface-2); }
.result .body { flex: 1; min-width: 0; }
.result .t { font-weight: 600; font-family: var(--f-display); }
.result .m { font-size: 0.8rem; color: var(--muted); }
.result .syn { font-size: 0.8rem; color: var(--muted); margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.result .add { color: var(--accent); font-weight: 600; font-size: 0.84rem; white-space: nowrap; }
.search-foot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.loading-line { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 12px 10px; font-size: 0.88rem; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- charts ---------- */
.bars { display: flex; align-items: flex-end; gap: 4px; border-bottom: 1px solid var(--line); position: relative; }
.bars::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--line); pointer-events: none; }
.bar { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; padding: 0; cursor: default; color: inherit; position: relative; }
.bar.click { cursor: pointer; }
.bar .track { width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.bar .fill { width: 64%; min-width: 3px; border-radius: 4px 4px 0 0; background: var(--accent); opacity: .85; transition: opacity .12s; }
.bar.today .fill { opacity: 1; }
.bar.ribbon .fill { background: var(--ribbon); }
.bar.click:hover .fill { opacity: .6; }
.bar .lb { font-family: var(--f-mono); font-size: 0.62rem; color: var(--muted); white-space: nowrap; overflow: hidden; max-width: 100%; }
.bar.today .lb { color: var(--ink); font-weight: 500; }
.chart-scale { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 0.66rem; color: var(--muted); margin-bottom: 6px; }

.dist { display: grid; gap: 12px; }
.dist-top { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; margin-bottom: 5px; }
.dist-top .n { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dist-top .v { color: var(--muted); font-size: 0.8rem; font-family: var(--f-mono); white-space: nowrap; }

/* calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.cal-title { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; }
.wk, .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wk div { text-align: center; font-family: var(--f-mono); font-size: 0.68rem; color: var(--muted); }

function searchCatalog(q) {
  const nq = norm(q).trim(); const toks = nq.split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  return CATALOG.map((b) => {
    if (!toks.every((t) => b.key.includes(t))) return null;
    const nt = norm(b.title);
    return { b, s: (nt.startsWith(nq) ? 3 : 0) + (nt.includes(nq) ? 2 : 0) + (nt.startsWith(toks[0]) ? 1 : 0) };
  }).filter(Boolean).sort((a, c) => c.s - a.s).slice(0, 10).map((x) => x.b);
}

  const opt = (s) => `<option value="${s.id}" ${s.id === current ? 'selected' : ''}>${esc(s.name)}</option>`;
  let h = includeNone ? `<option value="" ${!current ? 'selected' : ''}>Sem matéria</option>` : '';

  S.groups.forEach((g) => { const l = byG.get(g.id); if (l.length) h += `<optgroup label="${esc(g.name)}">${l.map(opt).join('')}</optgroup>`; });

/* =====================================================================
   Alarme do regressivo (roda em qualquer tela)
   ===================================================================== */
let audioCtx = null;
function primeAudio() { try { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; if (!audioCtx) audioCtx = new C(); audioCtx.resume && audioCtx.resume(); } catch (e) { /* sem áudio */ } }
function beep() {
  try {
    if (!audioCtx) return; const now = audioCtx.currentTime;
    [0, 0.35, 0.7].forEach((o) => {
      const osc = audioCtx.createOscillator(); const g = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, now + o); g.gain.exponentialRampToValueAtTime(0.3, now + o + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + o + 0.3);
      osc.connect(g).connect(audioCtx.destination); osc.start(now + o); osc.stop(now + o + 0.32);
    });
  } catch (e) { /* sem áudio */ }
}

      body = `<div class="timer">${active ? pill : selectHtml}<div class="clock" id="h-clock">${fmtClock(elapsed(t))}</div><div class="timer-controls">${

            : '<button class="btn btn-soft" data-t="resume">Continuar</button><button class="btn btn-primary" data-t="stop">Encerrar</button><button class="btn btn-ghost" data-t="discard">Descartar</button>'}</div></div>`;
    } else if (mode === 'countdown') {
      if (!active) {
        body = `<div class="timer">${selectHtml}<div style="margin-top:14px"><div class="presets">${[25, 45, 50, 60, 90].map((n) => `<button type="button" class="btn btn-line btn-sm ${cdMin === n ? 'on' : ''}" data-pre="${n}">${n} min</button>`).join('')}</div>
          <div class="row" style="max-width:260px;margin:0 auto"><div class="field"><label class="lbl" for="cd-h">Horas</label><input type="number" id="cd-h" min="0" max="12" value="${Math.floor(cdMin / 60)}"></div><div class="field"><label class="lbl" for="cd-m">Minutos</label><input type="number" id="cd-m" min="0" max="59" value="${cdMin % 60}"></div></div></div>
          <div class="timer-controls"><button class="btn btn-primary" data-t="startcd">Iniciar regressivo</button></div></div>`;
      } else {
        const rem = remaining(t); const pct = t.target ? Math.min(100, (elapsed(t) / t.target) * 100) : 0; const urgent = rem != null && t.target && rem / t.target < 0.1;
        body = `<div class="timer">${pill}<div class="clock ${urgent ? 'urgent' : ''}" id="h-clock">${fmtClock(rem)}</div><div class="meter" style="max-width:320px;margin:0 auto 18px"><i id="h-prog" style="width:${pct}%"></i></div>
          <div class="timer-controls">${t.status === 'running' ? '<button class="btn btn-soft" data-t="pause">Pausar</button>' : '<button class="btn btn-soft" data-t="resume">Continuar</button>'}<button class="btn btn-ghost" data-t="extend">+5 min</button><button class="btn btn-primary" data-t="stop">Encerrar</button>${t.status === 'paused' ? '<button class="btn btn-ghost" data-t="discard">Descartar</button>' : ''}</div></div>`;

      body = `<div class="field"><label class="lbl" for="h-subj">Matéria</label><select id="h-subj">${subjectOptions(selected)}</select></div>
        <div class="row"><div class="field"><label class="lbl" for="mn-date">Data</label><input type="date" id="mn-date" value="${todayKey()}" max="${todayKey()}"></div><div class="field"><label class="lbl" for="mn-start">Início</label><input type="time" id="mn-start" value="${pad2(Math.max(0, now.getHours() - 1))}:${pad2(now.getMinutes())}"></div></div>
        <div class="row"><div class="field"><label class="lbl" for="mn-h">Horas</label><input type="number" id="mn-h" min="0" max="23" value="0"></div><div class="field"><label class="lbl" for="mn-m">Minutos</label><input type="number" id="mn-m" min="0" max="59" value="45"></div></div>
        <div class="field"><label class="lbl" for="mn-note">Nota (opcional)</label><textarea id="mn-note" placeholder="O que você estudou?"></textarea></div>
        <div class="field"><span class="lbl">Como foi? (opcional)</span>${ratingsHtml()}</div>
        <button class="btn btn-primary btn-block" data-t="manual">Registrar sessão</button>`;
    }
    box.innerHTML = `<div class="section-head" style="margin-bottom:14px"><h2>Sessão de estudo</h2><div class="seg">
      <button data-mode="timer" class="${mode === 'timer' ? 'on' : ''}" ${active && mode !== 'timer' ? 'disabled' : ''}>Cronômetro</button>
      <button data-mode="countdown" class="${mode === 'countdown' ? 'on' : ''}" ${active && mode !== 'countdown' ? 'disabled' : ''}>Regressivo</button>
      <button data-mode="manual" class="${mode === 'manual' ? 'on' : ''}" ${active ? 'disabled' : ''}>Manual</button></div></div>${body}`;

    $$('[data-mode]', box).forEach((b) => b.addEventListener('click', () => { if (getTimer().status !== 'idle') return; mode = b.dataset.mode; paintTimer(); }));
    const sel = $('#h-subj', box); if (sel) bindSubjectSelect(sel, (id) => { selected = id; if (id && sel.value !== id) paintTimer(); });
    $$('[data-pre]', box).forEach((b) => b.addEventListener('click', () => { cdMin = +b.dataset.pre; paintTimer(); }));
    rs = {}; bindRatings(box, rs);
    clearInterval(tick);
    if (getTimer().status === 'running') {
      tick = setInterval(() => {
        const tt = getTimer(); const c = $('#h-clock', box); if (!c) return;
        if (tt.mode === 'countdown') { c.textContent = fmtClock(remaining(tt)); const p = $('#h-prog', box); if (p && tt.target) p.style.width = Math.min(100, (elapsed(tt) / tt.target) * 100) + '%'; c.classList.toggle('urgent', !!tt.target && remaining(tt) / tt.target < 0.1); } else c.textContent = fmtClock(elapsed(tt));

  $('#h-timer', el).addEventListener('click', (e) => {
      const box = $('#h-timer', el);
      const b = e.target.closest('[data-t]'); if (!b) return; const a = b.dataset.t;
      if ((a === 'start' || a === 'startcd' || a === 'manual') && !selected) { toast('Escolha ou crie uma matéria primeiro'); return; }
      if (a === 'start') { primeAudio(); startTimer(selected); }
      if (a === 'startcd') {
        const secs = intOr($('#cd-h', box).value) * 3600 + intOr($('#cd-m', box).value) * 60;
        if (secs <= 0) { toast('Defina uma duração'); return; }
        cdMin = Math.round(secs / 60); primeAudio(); startTimer(selected, 'countdown', secs);
      }
      if (a === 'pause') pauseTimer();
      if (a === 'resume') { primeAudio(); resumeTimer(); }
      if (a === 'extend') { extendTimer(300); toast('+5 minutos'); }
      if (a === 'discard') { discardTimer(); toast('Sessão descartada'); }
      if (a === 'stop') { finishSessionModal(); return; }
      if (a === 'manual') {
        const secs = intOr($('#mn-h', box).value) * 3600 + intOr($('#mn-m', box).value) * 60;
        if (secs <= 0) { toast('Informe a duração'); return; }
        const start = new Date(`${$('#mn-date', box).value || todayKey()}T${$('#mn-start', box).value || '12:00'}:00`);
        put('sessions', { id: uid(), subjectId: selected, startTime: start.toISOString(), endTime: new Date(start.getTime() + secs * 1000).toISOString(), durationSeconds: secs, note: $('#mn-note', box).value.trim(), type: 'manual', ratings: collectRatings(rs) });
        toast(`Sessão registrada: ${fmtDur(secs)}`);
      }
      paintTimer();
  });

  let timerSig = JSON.stringify(getTimer());
  paintLedger(); paintReading(); paintTimer();
  const unsub = subscribe(() => {
    paintLedger(); paintReading();
    const ts = JSON.stringify(getTimer()); const ss = JSON.stringify(S.subjects.map((s) => [s.id, s.name, s.archived, s.groupId])) + S.groups.length;
    if (ts !== timerSig || (ss !== subjSig && mode !== 'manual')) { timerSig = ts; paintTimer(); }
  });
  return () => { unsub(); clearInterval(tick); };
}

/* ---------------- busca online: Google Books + Open Library ---------------- */
const GENRE_PT = { 'fiction': 'Ficção', 'business & economics': 'Negócios e economia', 'biography & autobiography': 'Biografia', 'self-help': 'Autoajuda', 'psychology': 'Psicologia', 'history': 'História', 'philosophy': 'Filosofia', 'science': 'Ciência', 'juvenile fiction': 'Juvenil', 'young adult fiction': 'Jovem adulto', 'literary criticism': 'Crítica literária', 'political science': 'Ciência política', 'social science': 'Ciências sociais', 'religion': 'Religião', 'body, mind & spirit': 'Espiritualidade', 'education': 'Educação', 'mathematics': 'Matemática', 'computers': 'Computação', 'law': 'Direito', 'medical': 'Medicina', 'poetry': 'Poesia', 'drama': 'Teatro', 'comics & graphic novels': 'Quadrinhos', 'travel': 'Viagem', 'cooking': 'Culinária', 'health & fitness': 'Saúde', 'family & relationships': 'Relacionamentos', 'true crime': 'Crime real', 'art': 'Arte', 'language arts & disciplines': 'Linguagem' };
const ptGenre = (g) => (g ? GENRE_PT[String(g).toLowerCase()] || g : '');
function fromGoogle(it) {
  const v = it.volumeInfo || {}; const img = v.imageLinks || {};
  const cover = (img.thumbnail || img.smallThumbnail || '').replace(/^http:/, 'https:').replace('&edge=curl', '');
  return { title: v.title || '', author: (v.authors || []).join(', '), pages: v.pageCount || null, year: intOr(String(v.publishedDate || '').slice(0, 4)) || null, publisher: v.publisher || '', genre: ptGenre((v.categories || [])[0]), cover, lang: v.language || '', source: 'google' };
}
function fromOL(d) {
  return { title: d.title || '', author: (d.author_name || []).slice(0, 2).join(', '), pages: d.number_of_pages_median || null, year: d.first_publish_year || null, publisher: '', genre: '', cover: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : '', lang: '', source: 'openlibrary' };
}
async function searchOnline(term, signal) {
  const q = encodeURIComponent(term);
  const get = (url, map, key) => fetch(url, { signal }).then((r) => (r.ok ? r.json() : {})).then((j) => (j[key] || []).map(map)).catch((e) => { if (e.name === 'AbortError') throw e; return null; });
  const [pt, any, ol] = await Promise.all([
    get(`https://www.googleapis.com/books/v1/volumes?q=${q}&printType=books&maxResults=20&langRestrict=pt`, fromGoogle, 'items'),
    get(`https://www.googleapis.com/books/v1/volumes?q=${q}&printType=books&maxResults=20`, fromGoogle, 'items'),
    get(`https://openlibrary.org/search.json?q=${q}&limit=10&fields=title,author_name,number_of_pages_median,first_publish_year,cover_i`, fromOL, 'docs'),
  ]);
  if (pt === null && any === null && ol === null) throw new Error('offline');
  const seen = new Set(); const out = [];
  [...(pt || []), ...(any || []), ...(ol || [])].forEach((b) => {
    if (!b.title) return;
    const k = `${norm(b.title)}|${norm(b.author).split(',')[0]}|${b.pages || ''}|${norm(b.publisher)}`;
    if (seen.has(k)) return; seen.add(k); out.push(b);
  });
  // edições com número de páginas primeiro, mantendo a relevância
  return out.map((b, i) => ({ b, s: i + (b.pages ? 0 : 40) + (b.cover ? 0 : 6) })).sort((a, c) => a.s - c.s).slice(0, 16).map((x) => x.b);
}

function renderReading(el) {
  let query = ''; let online = { status: 'idle', q: '', results: [] }; let abort = null; let deb = null;
  el.innerHTML = `<div class="page-head"><div><h1>Leitura</h1><div class="sub">Seus livros, as páginas de cada dia e quando você deve terminar.</div></div><button class="btn btn-line" id="r-manual">Cadastrar manualmente</button></div>
    <div class="card"><div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="r-q" placeholder="Busque por título, autor ou ISBN" autocomplete="off" enterkeyhint="search" aria-label="Buscar livro"></div><div id="r-results"></div></div>
    <div id="r-body"></div>`;
  const q = $('#r-q', el);
  $('#r-manual', el).addEventListener('click', () => openBookForm({ prefill: { title: query } }));

  function paintResults() {
    const box = $('#r-results', el); const term = query.trim();
    if (!term) { box.innerHTML = ''; return; }
    const local = searchCatalog(term);
    const owned = new Set(S.books.map((b) => norm(b.title)));
    const isThis = online.q === term;
    const onl = isThis && online.status === 'done' ? online.results : [];
    const localKeys = new Set(local.map((b) => norm(b.title)));
    const list = [...local.map((b) => ({ b, src: 'local' })), ...onl.filter((b) => !(localKeys.has(norm(b.title)) && !b.cover)).map((b) => ({ b, src: 'online' }))];
    const row = (b, i) => `<button class="result" data-i="${i}">${coverHtml(b, 'sm')}<div class="body"><div class="t">${esc(b.title)}</div><div class="m">${esc(b.author || 'Autor desconhecido')}${b.year ? ` · ${b.year > 0 ? b.year : `${-b.year} a.C.`}` : ''}</div><div class="m">${b.pages ? `<span class="num">${b.pages}</span> páginas` : 'páginas não informadas'}${b.publisher ? ` · ${esc(b.publisher)}` : ''}</div></div><span class="add">${owned.has(norm(b.title)) ? 'Já na estante' : 'Adicionar'}</span></button>`;
    let html = list.length ? `<div class="results">${list.map((x, i) => row(x.b, i)).join('')}</div>` : '';
    if (isThis && online.status === 'loading') html += '<div class="loading-line"><span class="spinner"></span>Procurando edições no Google Books e na Open Library…</div>';
    if (isThis && online.status === 'done' && !list.length) html += '<div class="loading-line">Nenhum livro encontrado com esse nome.</div>';
    if (isThis && online.status === 'error') html += `<div class="notice ${local.length ? '' : 'warn'}" style="margin-top:10px">Sem internet para buscar online agora.${local.length ? ' Mostrando o catálogo salvo no app.' : ''}</div>`;
    html += `<div class="search-foot"><span class="small muted">Cada edição tem um número de páginas: escolha a sua.</span><button class="link" id="r-man2">Cadastrar “${esc(term)}” manualmente</button></div>`;
    box.innerHTML = html;
    $$('.result', box).forEach((btn) => btn.addEventListener('click', () => {
      const { b } = list[+btn.dataset.i];
      openBookForm({ prefill: { title: b.title, author: b.author, totalPages: b.pages, year: b.year && b.year > 0 ? b.year : null, genre: b.genre || '', cover: b.cover || '', source: b.source || 'catalogo' }, onSaved: () => { q.value = ''; query = ''; online = { status: 'idle', q: '', results: [] }; paintResults(); } });
    }));
    $('#r-man2', box).addEventListener('click', () => openBookForm({ prefill: { title: term } }));
  }
  async function runOnline() {
    const term = query.trim(); if (term.length < 3) return;

    if (abort) abort.abort(); abort = new AbortController();
    online = { status: 'loading', q: term, results: [] }; paintResults();
    try { const res = await searchOnline(term, abort.signal); if (query.trim() !== term) return; online = { status: 'done', q: term, results: res }; } catch (e) { if (e.name === 'AbortError') return; online = { status: 'error', q: term, results: [] }; }
    paintResults();

}

/* =====================================================================

function renderCalendar(el) {
  let view = 'month'; let metric = 'study'; let anchor = new Date();
  function paint() {
    const map = metric === 'study' ? studyTotalsByDay(hiddenSet()) : pagesByDay();
    const fmt = metric === 'study' ? fmtDur : (v) => `${v} pág.`;

    let title = ''; let body = '';
    if (view === 'month') {
      const first = startOfMonth(anchor); const last = endOfMonth(anchor); const lead = (first.getDay() + 6) % 7;
      title = `${cap1(MONTHS[anchor.getMonth()])} ${anchor.getFullYear()}`;
      let max = 1; for (let d = 1; d <= last.getDate(); d++) max = Math.max(max, map.get(dateKey(new Date(first.getFullYear(), first.getMonth(), d))) || 0);

      const days = [...Array(7)].map((_, i) => { const d = addDays(ws, i); return { d, k: dateKey(d), v: map.get(dateKey(d)) || 0 }; });

      <div class="seg"><button data-metric="study" class="${metric === 'study' ? 'on' : ''}">Estudo</button><button data-metric="pages" class="${metric === 'pages' ? 'on' : ''}">Leitura</button></div></div>
      <div class="card" style="max-width:640px"><div class="cal-head"><div style="display:flex;gap:4px"><button class="btn btn-ghost btn-sm" data-step="-1" aria-label="Anterior">‹</button><button class="btn btn-ghost btn-sm" data-today>Hoje</button><button class="btn btn-ghost btn-sm" data-step="1" aria-label="Próximo">›</button></div>
      <div class="cal-title">${title}</div><div class="seg"><button data-view="month" class="${view === 'month' ? 'on' : ''}">Mês</button><button data-view="week" class="${view === 'week' ? 'on' : ''}">Semana</button></div></div>${body}</div>`;
    $$('[data-metric]', el).forEach((b) => b.addEventListener('click', () => { metric = b.dataset.metric; paint(); }));
    $$('[data-view]', el).forEach((b) => b.addEventListener('click', () => { view = b.dataset.view; paint(); }));
    $$('[data-step]', el).forEach((b) => b.addEventListener('click', () => { const s = +b.dataset.step; anchor = view === 'month' ? new Date(anchor.getFullYear(), anchor.getMonth() + s, 1) : addDays(anchor, 7 * s); paint(); }));
    $('[data-today]', el).addEventListener('click', () => { anchor = new Date(); paint(); });

      <div class="card section"><div class="section-head"><h2>Tempo de estudo</h2><div class="row" style="gap:8px"><div class="seg"><button data-g="day" class="${gran === 'day' ? 'on' : ''}">Dia</button><button data-g="week" class="${gran === 'week' ? 'on' : ''}">Semana</button></div>${gran === 'day' ? `<div class="seg"><button data-r="7" class="${range === 7 ? 'on' : ''}">7 dias</button><button data-r="30" class="${range === 30 ? 'on' : ''}">30 dias</button></div>` : ''}</div></div>
        ${barChart(chart, { clickable: true, todayK: gran === 'day' ? todayKey() : dateKey(startOfWeek(now)) })}

    $$('.bar.click', el).forEach((b) => b.addEventListener('click', () => (gran === 'day' ? openDayDetail(b.dataset.key) : openWeekDetail(b.dataset.key))));
  }

/* =====================================================================
   Tela: Histórico
   ===================================================================== */
function renderHistory(el) {
  let tab = 'sessions'; const f = { subject: '', period: 'all', min: '', search: '' };
  el.innerHTML = `<div class="page-head"><div><h1>Histórico</h1><div class="sub" id="hi-count"></div></div><div class="seg"><button data-tab="sessions" class="on">Sessões</button><button data-tab="reading">Leituras</button></div></div>

  const inPeriod = (t) => {
    const now = new Date();
    if (f.period === 'today') return t >= startOfDay(now); if (f.period === 'week') return t >= startOfWeek(now); if (f.period === 'month') return t >= startOfMonth(now);
    if (f.period === '30d') return t >= addDays(startOfDay(now), -29); return true;

    const box = $('#hi-filters', el);
    box.hidden = false;
    box.innerHTML = `<div class="filters">
      <select id="hf-s" aria-label="Matéria ou livro">${tab === 'sessions' ? `<option value="">Todas as matérias</option><option value="__none__">Sem matéria</option>${S.subjects.map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}` : `<option value="">Todos os livros</option>${S.books.map((b) => `<option value="${b.id}">${esc(b.title)}</option>`).join('')}`}</select>
      <select id="hf-p" aria-label="Período"><option value="all">Todo o período</option><option value="today">Hoje</option><option value="week">Esta semana</option><option value="month">Este mês</option><option value="30d">Últimos 30 dias</option></select>
      <input type="number" id="hf-m" min="0" placeholder="${tab === 'sessions' ? 'Duração mín. (min)' : 'Mín. de páginas'}" value="${esc(f.min)}">
      <input type="search" id="hf-q" placeholder="Buscar nas notas" value="${esc(f.search)}"></div>`;
    $('#hf-s', box).value = f.subject; $('#hf-p', box).value = f.period;
    $('#hf-s', box).addEventListener('change', (e) => { f.subject = e.target.value; paintList(); });
    $('#hf-p', box).addEventListener('change', (e) => { f.period = e.target.value; paintList(); });
    $('#hf-m', box).addEventListener('input', (e) => { f.min = e.target.value; paintList(); });
    $('#hf-q', box).addEventListener('input', (e) => { f.search = e.target.value; paintList(); });
  }
  function paintList() {
    const box = $('#hi-list', el); const qn = norm(f.search);
    if (tab === 'sessions') {
      const sm = subjectById();
      const rows = S.sessions.filter((s) => {
        if (f.subject === '__none__' ? s.subjectId : f.subject && s.subjectId !== f.subject) return false;
        if (!inPeriod(new Date(s.startTime))) return false;
        if (f.min && s.durationSeconds < +f.min * 60) return false;

      }).sort((a, b) => (a.startTime < b.startTime ? 1 : -1));
      $('#hi-count', el).textContent = `${plural(rows.length, 'sessão', 'sessões')} · ${fmtDur(rows.reduce((a, s) => a + s.durationSeconds, 0))}`;

      $$('[data-edit]', box).forEach((b) => b.addEventListener('click', () => openSessionEdit(S.sessions.find((s) => s.id === b.dataset.edit))));
      $$('[data-del]', box).forEach((b) => b.addEventListener('click', async () => { if (await confirmDialog({ title: 'Excluir sessão?', message: 'Essa ação não pode ser desfeita.', confirmLabel: 'Excluir', danger: true })) { del('sessions', b.dataset.del); toast('Sessão excluída'); } }));
    } else {

  }
  async function exportBackup() {
    const bytes = buildBackup(); const name = `marcador-backup-${todayKey()}.xlsx`;
    const type = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    try {
      if (isIOS() && navigator.canShare) {
        const file = new File([bytes], name, { type });
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); LS.set('mk_lastbackup', new Date().toISOString()); paint(); return; }
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try {
      const url = URL.createObjectURL(new Blob([bytes], { type }));
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
      LS.set('mk_lastbackup', new Date().toISOString()); toast('Planilha baixada'); paint();
    } catch (e) { toast('Não foi possível baixar a planilha'); }
  }
  paint();
  const onSync = () => { if (auth) paintAcc(); };
  syncListeners.add(onSync);
  const unsub = subscribe(() => { if (!parsed && !busy && !(document.activeElement && el.contains(document.activeElement) && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) paint(); });
  return () => { unsub(); syncListeners.delete(onSync); };
}
/* ---------------- Mais (celular) ---------------- */
function renderMore(el) {
  el.innerHTML = `<div class="page-head"><h1>Mais</h1></div><div class="card more-list">
    <a href="#historico">Histórico <span>sessões e leituras</span></a><a href="#materias">Matérias <span>${plural(S.subjects.length, 'matéria', 'matérias')}</span></a><a href="#ajustes">Ajustes <span>metas e backup</span></a></div>`;
}

/* =====================================================================
   Navegação
   ===================================================================== */
const ICONS = {
  inicio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>',
  leitura: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M14 3v7l-2-1.5L10 10V3"/></svg>',
  calendario: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  estatisticas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  mais: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>',
};
const NAV = [['inicio', 'Início'], ['leitura', 'Leitura'], ['calendario', 'Calendário'], ['estatisticas', 'Estatísticas'], ['historico', 'Histórico'], ['materias', 'Matérias'], ['ajustes', 'Ajustes']];
const MOBILE = [['inicio', 'Início'], ['leitura', 'Leitura'], ['calendario', 'Calendário'], ['estatisticas', 'Estatísticas'], ['mais', 'Mais']];
$('#nav').innerHTML = NAV.map(([k, l]) => `<a href="#${k}" data-nav="${k}">${l}</a>`).join('');
$('#bottomnav').innerHTML = MOBILE.map(([k, l]) => `<a href="#${k}" data-nav="${k}">${ICONS[k]}<span>${l}</span></a>`).join('');
const ROUTES = { inicio: renderHome, leitura: renderReading, calendario: renderCalendar, estatisticas: renderStats, historico: renderHistory, materias: renderSubjects, ajustes: renderSettings, mais: renderMore };
const outlet = $('#outlet'); let cleanup = null;
function route() {
  let name = location.hash.replace(/^#/, ''); if (!ROUTES[name]) name = 'inicio';
  if (typeof cleanup === 'function') { try { cleanup(); } catch (e) { /* noop */ } }
  cleanup = null; outlet.innerHTML = ''; window.scrollTo(0, 0);
  cleanup = ROUTES[name](outlet) || null;
  const sub = ['historico', 'materias', 'ajustes'].includes(name) ? 'mais' : name;
  $$('[data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === name || (a.closest('#bottomnav') && a.dataset.nav === sub)));
}
function go(name) { if (location.hash.slice(1) === name) route(); else location.hash = name; }
window.addEventListener('hashchange', route);
async function boot() {
  // links de confirmação de e-mail e de nova senha chegam com o token no endereço
  const h = location.hash;
  let recovery = false; let authFail = false;
  if (/access_token=|error_description=/.test(h)) {
    const p = new URLSearchParams(h.slice(1));
    history.replaceState(null, '', location.pathname + '#inicio');
    if (p.get('access_token')) {
      try {
        const at = p.get('access_token');
        const user = await authReq('user', null, { method: 'GET', bearer: at });
        saveSession({ access_token: at, refresh_token: p.get('refresh_token'), expires_at: +p.get('expires_at') || 0, expires_in: +p.get('expires_in') || 3600 }, user);
        recovery = p.get('type') === 'recovery';
      } catch (e) { authFail = true; }
    } else authFail = true;
  }
  setSync(auth ? 'syncing' : 'local');
  route();
  if (authFail) toast('Esse link expirou ou já foi usado. Peça outro em Ajustes.');
  if (auth) { if (LS.get('mk_linked', null) !== auth.user.id) await onLogin(); else syncNow(); }
  if (recovery) openNewPasswordModal();
}
boot();
setInterval(() => { if (auth && document.visibilityState === 'visible') scheduleSync(0); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleSync(0); });
window.addEventListener('online', () => scheduleSync(0));
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
}());
